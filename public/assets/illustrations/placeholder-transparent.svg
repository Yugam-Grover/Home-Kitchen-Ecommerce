<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#1C2B1E" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Stylized product shape on transparent bg -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <path d="M 150 250 L 450 250 A 150 150 0 0 1 300 400 A 150 150 0 0 1 150 250 Z" fill="#8DAB93"/>
    <!-- Lid/Rim -->
    <rect x="120" y="230" width="360" height="20" rx="10" fill="#4A5D4E" />
    <!-- Handle -->
    <path d="M 230 230 V 160 A 70 70 0 0 1 370 160 V 230" fill="none" stroke="#4A5D4E" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
